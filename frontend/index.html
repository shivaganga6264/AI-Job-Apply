<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Job Auto Apply</title>
    <link rel="manifest"
      href="manifest.json">
      
    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>AI Job Auto Apply</h1>

            <h2 id="status">
                Ready To Apply
            </h2>

            <h3>
                Applied Jobs:
                <span id="count">0</span>
            </h3>

            <button id="applyBtn">
                APPLY NOW
            </button>

            <hr>

            <h2>
                Recent Applications
            </h2>

            <div id="history">

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
